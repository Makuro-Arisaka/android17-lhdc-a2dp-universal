# ============================================================================
# lhdc-a2dp-universal 配置
# 改完存盘即可，下次开机生效（也可手动执行 post-fs-data.sh 立即应用）
# ============================================================================

# 强制指定 sku 目录名（如 ukee / taro / kalama / pineapple），留空 = 自动定位。
# 自动定位顺序：上次学到的活跃路径 > 属性匹配 > 唯一候选 > 全部候选。
SKU=

# 无法判定活跃 sku 时，是否把全部候选都处理。
# 1 = 是（推荐，安全兜底：没被加载的那份补了也无副作用）
PATCH_ALL=1

# 是否把 persist.bluetooth.a2dp_offload.disabled 从 true 纠正回 false。
# ⚠️ 这个属性为 true 会让 A2DP 彻底无声，务必保持 1。
OFFLOAD_FIX=1

# 跳过前置条件检查（Android 版本 / AOSP 蓝牙音频 HAL 是否存在）。1 = 强制。
# 设备不满足前提时强上，可能反而把音频搞坏，非必要不要开。
FORCE=0

# 低于该 SDK 直接跳过。AOSP 的 LHDC 编码器自 Android 17 (SDK 37) 起才有，
# 低版本上声明 AUDIO_FORMAT_LHDC 没有意义且可能干扰编码选择。
MIN_SDK=37

# 1 = 额外往 stdout 输出日志（调试用）
VERBOSE=0

# dumpsys 单次调用超时（秒），默认 20。
# 设备因为**别的**故障长时间高负载时（实测遇到过 load 57），dumpsys 可能几分钟
# 不返回，没有超时会把 service.sh 挂在开机阶段下不来。别设成 0（0 = 不超时）。
# 注意：这是独立变量，不叫 DUMPSYS_TIMEOUT。
LHDC_DUMPSYS_TIMEOUT=20
